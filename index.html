<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Near Market — Dakshin Dinajpur</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">📍 Near Market</div>
        <p class="tagline">Dakshin Dinajpur-এর নিজের local marketplace</p>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="দোকান, খাবার বা কাজের লোক খুঁজুন...">
            <button onclick="searchServices()">Search</button>
        </div>
    </header>

    <main>
        <h2>আপনি কী খুঁজছেন?</h2>
        <div class="category-grid">
            <div class="card" onclick="filterCategory('shop')">🛒 Market & Shops</div>
            <div class="card" onclick="filterCategory('food')">🍔 Food</div>
            <div class="card" onclick="filterCategory('repair')">🔧 Repairing</div>
            <div class="card" onclick="filterCategory('worker')">👷 Home Worker</div>
            <div class="card" onclick="filterCategory('all')">🔄 Show All</div>
        </div>

        <button onclick="openAddForm()" class="add-btn">+ নিজের Shop / Service যোগ করুন</button>

        <h2>Local Services</h2>
        <div id="services-list" class="services-grid">
            <!-- Services will load here -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
